<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f7" id="mobileThemeColor"><title>Лиды</title><style>html,body{margin:0;min-height:100%;background:#f3f5f7}#boot{font:16px system-ui;padding:24px;color:#112632}</style></head><body><div id="boot">Загрузка CRM…</div><script>
(async()=>{const css=`:root{--bg:#f3f5f7;--card:#fff;--ink:#112632;--muted:#667784;--line:#dfe5e9;--primary:#2054ec;--hover:#edf2f8;--selected:#e8eefc} :root[data-theme=dark]{--bg:#141919;--card:#1c2323;--ink:#eef4f2;--muted:#a9bab6;--line:#35433f;--primary:#acc6ff;--hover:#26322f;--selected:#283e46;color-scheme:dark}html,body{height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink)}.top{height:64px;min-height:64px;background:var(--card);color:var(--ink)}.layout{height:calc(100dvh - 64px);grid-template-columns:330px minmax(0,1fr);background:var(--bg)}.side,.card,.savebar,.login form,.in,select,textarea,.btn{background:var(--card);color:var(--ink);border-color:var(--line)}.side{background:var(--card)}.item:hover{background:var(--hover)}.item.on{background:var(--selected)}.main{background:var(--bg)}.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}.in:focus,select:focus,textarea:focus{border-color:var(--primary)}#mobileTools{display:flex;gap:8px;align-items:center;margin-left:8px}.mobile-tool{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);min-height:44px;padding:8px 12px;font-size:20px}.mobile-back{display:none}@media(max-width:900px){html,body{overflow:hidden}.top{display:flex;flex-wrap:nowrap;padding:8px 10px;gap:7px}.top h1{font-size:17px}.top .sp{flex:1}.top #newBtn{font-size:0;padding:8px 12px}.top #newBtn:after{content:'+';font-size:22px}.layout{display:block;height:calc(100dvh - 64px);position:relative}.side{height:100%;max-height:none;border:0}.main{display:none;height:100%;overflow:auto;padding:16px}.mobile-detail .side{display:none}.mobile-detail .main{display:block}.mobile-back{display:inline-flex;margin:0 0 12px}.grid{display:block}.col{display:contents}.card{margin-bottom:12px;padding:14px;border-radius:12px}.card[data-mobile-panel]{display:none}.card[data-mobile-panel=all]{display:block}.mobile-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--hover);padding:4px;border-radius:10px;margin-bottom:12px}.mobile-tabs button{min-height:42px;border:0;border-radius:8px;background:transparent;color:var(--muted)}.mobile-tabs button.active{background:var(--card);color:var(--ink);font-weight:700}.row,.row4{grid-template-columns:1fr}.head{display:block}.head h2{font-size:21px;margin-bottom:8px}.head select{width:100%!important;min-height:44px}.savebar{position:sticky;bottom:0;margin:12px -14px -14px;padding:12px 14px}.savebar .sp{display:none}.savebar #saveBtn{flex:1}.frame{height:190px}.list{padding-bottom:12px}.item{padding:14px 16px;min-height:82px}.filters{padding:10px}.filters input,.filters select{min-height:44px;font-size:16px}.mobile-tabs~.grid{}body.mobile-plan .card[data-mobile-panel=plan],body.mobile-contacts .card[data-mobile-panel=contacts],body.mobile-message .card[data-mobile-panel=message],body.mobile-site .card[data-mobile-panel=site]{display:block}body.mobile-plan .card[data-mobile-panel=all],body.mobile-contacts .card[data-mobile-panel=all],body.mobile-message .card[data-mobile-panel=all],body.mobile-site .card[data-mobile-panel=site]{display:none}body.mobile-plan .card[data-mobile-panel=plan]{display:block}body.mobile-contacts .card[data-mobile-panel=contacts]{display:block}body.mobile-message .card[data-mobile-panel=message]{display:block}body.mobile-site .card[data-mobile-panel=site]{display:block}}@media(min-width:901px){.mobile-tabs{display:none}}`;let html=await (await fetch('/admin.html',{cache:'no-store'})).text();html=html.replace('</head>',`<style>${css}</style></head>`);html=html.replace('</body>',`<script>(()=>{const d=document.documentElement;let t=localStorage.getItem('crm-theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';d.dataset.theme=t;const tools=document.createElement('div');tools.id='mobileTools';tools.innerHTML='<button class="mobile-tool" id="themeBtn" aria-label="Тема">◐</button>';document.querySelector('.top .sp')?.after(tools);document.querySelector('#themeBtn')?.addEventListener('click',()=>{const n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;localStorage.setItem('crm-theme',n);document.querySelector('#mobileThemeColor')?.setAttribute('content',n==='dark'?'#141919':'#f3f5f7')});const side=document.querySelector('.side'),main=document.querySelector('.main');let scroll=0;function detail(on){document.body.classList.toggle('mobile-detail',on);if(!on)requestAnimationFrame(()=>{document.querySelector('.list').scrollTop=scroll})}function addNav(){if(!main||main.querySelector('.mobile-back'))return;const back=document.createElement('button');back.className='btn mobile-back';back.textContent='← Все компании';back.onclick=()=>detail(false);main.prepend(back);document.querySelectorAll('.item').forEach(x=>x.addEventListener('click',()=>{scroll=document.querySelector('.list').scrollTop;detail(true)},{capture:true}));const tabs=document.createElement('div');tabs.className='mobile-tabs';tabs.innerHTML='<button data-m="plan">Задача</button><button data-m="contacts">Контакты</button><button data-m="message">Текст</button><button data-m="site">Демо</button>';main.insertBefore(tabs,main.firstElementChild?.nextElementSibling||main.firstChild);const cards=[...document.querySelectorAll('.card')];cards.forEach((c,i)=>c.dataset.mobilePanel=['contacts','contacts','contacts','plan','site','message'][i]||'all');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.body.className='mobile-detail mobile-'+b.dataset.m;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))});tabs.querySelector('button').click()}new MutationObserver(addNav).observe(document.body,{childList:true,subtree:true});addNav()})()</script></body>`);document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<pre style="padding:20px">Не удалось загрузить CRM: '+e+'</pre>'});
</script></body></html>
